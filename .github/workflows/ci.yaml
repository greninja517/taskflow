name: CI

on:
    workflow_dispatch:
    push:
        branches: [ main ]

jobs:
    test:
        name: Test
        runs-on: ubuntu-22.04
        steps:
        -   name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
            
        -   name: Setup Language Toolchain
            uses: actions/setup-node@v7
            with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: 'frontend/package-lock.json'
        # Setup Node action automatically uses actions/setup-cache so, no need to use
        # separate step to cache the deps
        
        -   name: Install dependencies
            working-directory: frontend
            run:
                npm ci
            
        -   name: Linting
            working-directory: frontend
            run:
                npm run lint
        
        -   name: Unit Tests
            working-directory: frontend
            run:
                npm run test