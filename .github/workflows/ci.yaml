name: CI

on:
    workflow_dispatch:
    #=======================
    # NOT Needed to run the checks and security scan again if the branch
    # protection is already well configured and need required checks before merge to main
    # push:
    #     branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    detect-change:
        name: Identify changed service
        runs-on: ubuntu-22.04
        permissions:
            pull-requests: read
        outputs:
            changed-services: ${{ steps.filter.outputs.changes }}
        # Outputs the JSON array of names of filters defined (essentially changed services)
        steps:
        -   name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

        -   name: Detect changed service
            uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c #v4.0.0
            id: filter
            with:
                filters: .github/filters.yaml

    test:
        name: Test and Validate
        needs: detect-change
        runs-on: ubuntu-22.04
        strategy:
            fail-fast: false
            matrix:
                service: $${{ fromJson(needs.detect-change.outputs.changed-services) }}
        steps:
        -   name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
            with:
                fetch-depth: 0  # Needed for Sonarqube to know about the past context
            
        -   name: Setup Language Toolchain
            uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
            with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: '${{ matrix.service }}/package-lock.json'
        # Setup-Node action automatically uses actions/setup-cache so, no need to use
        # separate step to cache the deps
        
        -   name: Install dependencies
            working-directory: ${{ matrix.service }}
            run:
                npm ci
            
        -   name: Linting
            working-directory: ${{ matrix.service }}
            run:
                npm run lint
        
        -   name: Frontend Unit Tests
            if: ${{ matrix.service == 'frontend' }}
            continue-on-error: true
            working-directory: ${{ matrix.service }}
            run:
                npm run test

        -   name: Backend Unit Tests
            if: ${{ matrix.service == 'backend' }}
            working-directory: ${{ matrix.service }}
            run:
                npm run test:unit
        
        # Security Scan with Sonarqube
        -   name: SonarQube Scan
            uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f #v8.2.1
            env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
